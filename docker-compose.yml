# FraudPulse local stack. Start with: make up
name: fraudpulse

# The generator image, shared by three services (seed users, seed merchants, stream payments).
x-generator: &generator
  build:
    context: ./generator
    additional_contexts:
      schemas: ./ingestion/schemas

services:
  payments-core-db:
    image: postgres:16
    # Debezium reads the database's change log; that needs wal_level=logical.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: payments_core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_APP_PASSWORD:?Set PAYMENTS_APP_PASSWORD in .env}
      DEBEZIUM_PG_PASSWORD: ${DEBEZIUM_PG_PASSWORD:?Set DEBEZIUM_PG_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable from this laptop only, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - payments_core_data:/var/lib/postgresql/data
      - ./sources/payments-core/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d payments_core"]
      interval: 5s
      timeout: 3s
      retries: 10

  merchant-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: merchants
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MERCHANT_APP_PASSWORD: ${MERCHANT_APP_PASSWORD:?Set MERCHANT_APP_PASSWORD in .env}
      DEBEZIUM_MYSQL_PASSWORD: ${DEBEZIUM_MYSQL_PASSWORD:?Set DEBEZIUM_MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - merchant_data:/var/lib/mysql
      - ./sources/merchant-app/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  merchant-app:
    build: ./sources/merchant-app
    environment:
      MERCHANT_APP_PASSWORD: ${MERCHANT_APP_PASSWORD:?Set MERCHANT_APP_PASSWORD in .env}
      MERCHANT_DB_HOST: merchant-db
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      merchant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    environment:
      # KRaft mode: this one node is both the broker and its own controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Two doors: INTERNAL for other containers, EXTERNAL for programs on the laptop.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker, so internal topics can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (kafka-init below), never by a typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Runs once, creates the topics, then exits.
  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic payments.transactions --partitions 6 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic payments.dlq --partitions 3 --replication-factor 1
        # Debezium's MySQL table-definition history: one partition, kept forever.
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic schemahistory.merchants --partitions 1 --replication-factor 1 \
          --config retention.ms=-1 --config retention.bytes=-1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      # A new schema version must still be able to read old data.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-connect:
    build: ./ingestion/debezium
    depends_on:
      # The databases must have finished their init scripts (Debezium users) first.
      payments-core-db:
        condition: service_healthy
      merchant-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: fraudpulse-connect
      # Connect keeps connector configs, read positions and status in these topics.
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # CDC events are Avro too, with their schemas in Schema Registry.
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # Lets connector configs say ${env:NAME} instead of containing passwords.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_PG_PASSWORD: ${DEBEZIUM_PG_PASSWORD:?Set DEBEZIUM_PG_PASSWORD in .env}
      DEBEZIUM_MYSQL_PASSWORD: ${DEBEZIUM_MYSQL_PASSWORD:?Set DEBEZIUM_MYSQL_PASSWORD in .env}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # Registers every connector in ingestion/debezium/*.json, then exits. Safe to run again.
  connect-init:
    image: curlimages/curl:8.11.0
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./ingestion/debezium:/connectors:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for file in /connectors/*.json; do
          name=$$(basename "$$file" .json)
          echo "registering $$name"
          curl -fsS -X PUT -H "Content-Type: application/json" --data @"$$file" \
            "http://kafka-connect:8083/connectors/$$name/config" > /dev/null
        done

  # Loads the generator's users into Postgres (idempotent), then exits.
  payments-seed:
    <<: *generator
    entrypoint: ["fraudpulse-seed"]
    command: ["--users", "5000"]
    environment:
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_APP_PASSWORD:?Set PAYMENTS_APP_PASSWORD in .env}
      PAYMENTS_DB_HOST: payments-core-db
    depends_on:
      payments-core-db:
        condition: service_healthy
    restart: "no"

  # Onboards and approves the generator's merchants through the merchant API, then exits.
  merchants-seed:
    <<: *generator
    entrypoint: ["fraudpulse-seed-merchants"]
    command: ["--merchants", "500"]
    environment:
      MERCHANT_APP_URL: http://merchant-app:8000
    depends_on:
      merchant-app:
        condition: service_healthy
    restart: "no"

  # Streams payments into Kafka, in real time, until stopped.
  generator:
    <<: *generator
    command: ["run", "--sink", "kafka", "--rate", "${GENERATOR_RATE:-5}", "--late-ratio", "${GENERATOR_LATE_RATIO:-0.02}"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      payments-seed:
        condition: service_completed_successfully
      merchants-seed:
        condition: service_completed_successfully
    restart: on-failure

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: fraudpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      JAVA_OPTS: -Xms128m -Xmx384m
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  payments_core_data:
  merchant_data:
  kafka_data:
