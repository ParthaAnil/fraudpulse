# FraudPulse local stack. Start with: docker compose up -d
name: fraudpulse

services:
  payments-core-db:
    image: postgres:16
    # Debezium (Step 6) reads the database's change log; that needs wal_level=logical.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: payments_core
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_APP_PASSWORD:?Set PAYMENTS_APP_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable from this laptop only, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - payments_core_data:/var/lib/postgresql/data
      - ./sources/payments-core/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_core"]
      interval: 5s
      timeout: 3s
      retries: 10

  merchant-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: merchants
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MERCHANT_APP_PASSWORD: ${MERCHANT_APP_PASSWORD:?Set MERCHANT_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - merchant_data:/var/lib/mysql
      - ./sources/merchant-app/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  merchant-app:
    build: ./sources/merchant-app
    environment:
      MERCHANT_APP_PASSWORD: ${MERCHANT_APP_PASSWORD:?Set MERCHANT_APP_PASSWORD in .env}
      MERCHANT_DB_HOST: merchant-db
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      merchant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  payments_core_data:
  merchant_data:
