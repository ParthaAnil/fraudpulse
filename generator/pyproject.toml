[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fraudpulse-generator"
version = "0.1.0"
description = "Synthetic UPI payment generator with injected fraud for FraudPulse"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "fastavro>=1.9",
    "faker>=30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudpulse_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[project.scripts]
fraudpulse-gen = "fraudpulse_generator.cli:main"
fraudpulse-seed = "fraudpulse_generator.seed:main"
fraudpulse-seed-merchants = "fraudpulse_generator.seed_merchants:main"
